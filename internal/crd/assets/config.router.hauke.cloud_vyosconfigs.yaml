---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: vyosconfigs.config.router.hauke.cloud
spec:
  group: config.router.hauke.cloud
  names:
    categories:
    - router-api
    kind: VyOSConfig
    listKind: VyOSConfigList
    plural: vyosconfigs
    shortNames:
    - vc
    singular: vyosconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="ConfigApplied")].status
      name: Applied
      type: string
    - jsonPath: .status.conditions[?(@.type=="VRRPMaster")].reason
      name: VRRP
      type: string
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VyOSConfig boots a VyOS router and keeps it configured.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              VyOSConfigSpec describes a VyOS router: what it boots and what it runs.

              Image, Files and Host go into the data the instance is created with, so a
              change to them replaces the router. Commands, Values and Management are
              applied to the running router.
            properties:
              commands:
                description: |-
                  Commands is the router's configuration as VyOS "set" commands, one per
                  line; empty lines and lines starting with # are ignored. It is a Go
                  template, see docs/configuration.md for the data it is rendered with.
                  The router is made to match it exactly: what is not listed is deleted,
                  apart from what the operator itself needs to stay in contact.
                maxLength: 524288
                type: string
              files:
                description: Files placed below /config at first boot.
                items:
                  description: |-
                    File is a file placed on the router when it is first booted, below /config,
                    the directory VyOS keeps across upgrades. Files are part of the bootstrap
                    data: changing one replaces the router.
                  properties:
                    configMapKeyRef:
                      description: ConfigMapKeyRef reads the value from a ConfigMap
                        in the same namespace.
                      properties:
                        key:
                          description: |-
                            The key to select from the ConfigMap's Data field.
                            Keys in the BinaryData field are not currently propagated to container env vars.
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the ConfigMap or its key must
                            be defined
                          type: boolean
                      required:
                      - key
                      type: object
                      x-kubernetes-map-type: atomic
                    path:
                      description: Path of the file. It has to be below /config.
                      maxLength: 255
                      pattern: ^/config/[A-Za-z0-9._/-]+$
                      type: string
                    permissions:
                      default: "0600"
                      description: Permissions as an octal string.
                      pattern: ^0[0-7]{3}$
                      type: string
                    secretKeyRef:
                      description: SecretKeyRef reads the value from a Secret in the
                        same namespace.
                      properties:
                        key:
                          description: The key of the secret to select from.  Must
                            be a valid secret key.
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the Secret or its key must
                            be defined
                          type: boolean
                      required:
                      - key
                      type: object
                      x-kubernetes-map-type: atomic
                    value:
                      description: Value is a literal.
                      maxLength: 65536
                      type: string
                  required:
                  - path
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of value, secretKeyRef and configMapKeyRef
                      is required
                    rule: '(has(self.value) ? 1 : 0) + (has(self.secretKeyRef) ? 1
                      : 0) + (has(self.configMapKeyRef) ? 1 : 0) == 1'
                type: array
                x-kubernetes-list-map-keys:
                - path
                x-kubernetes-list-type: map
              host:
                description: Host the container runs on.
                properties:
                  privateInterface:
                    default: eth1
                    description: PrivateInterface is the name the host's private network
                      interface gets.
                    pattern: ^eth[0-9]+$
                    type: string
                  publicInterface:
                    default: eth0
                    description: |-
                      PublicInterface is the name the host's public network interface gets,
                      and the name the configuration refers to it by.
                    pattern: ^eth[0-9]+$
                    type: string
                type: object
              image:
                description: Image is the VyOS container image, by digest for a reproducible
                  router.
                maxLength: 512
                minLength: 1
                type: string
              management:
                description: Management connection to the router.
                properties:
                  addressType:
                    default: ExternalIP
                    description: AddressType of the machine address the operator connects
                      to.
                    enum:
                    - Hostname
                    - ExternalIP
                    - InternalIP
                    - ExternalDNS
                    - InternalDNS
                    type: string
                  allowedSources:
                    description: |-
                      AllowedSources restricts the API on the router itself to these source
                      ranges, in addition to whatever firewall the infrastructure has. Leave
                      it empty when the operator's address changes.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  confirmTimeoutMinutes:
                    default: 2
                    description: |-
                      ConfirmTimeoutMinutes is how long the router waits for the operator to
                      confirm a change before it reverts it by itself. A change that cuts the
                      operator off is undone after this time.
                    format: int32
                    maximum: 60
                    minimum: 1
                    type: integer
                  port:
                    default: 443
                    description: Port the router's HTTPS API listens on.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              values:
                description: Values available to the templates.
                items:
                  description: |-
                    Value is a named input of the configuration template, available there as
                    {{ .Values.<name> }}.
                  properties:
                    configMapKeyRef:
                      description: ConfigMapKeyRef reads the value from a ConfigMap
                        in the same namespace.
                      properties:
                        key:
                          description: |-
                            The key to select from the ConfigMap's Data field.
                            Keys in the BinaryData field are not currently propagated to container env vars.
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the ConfigMap or its key must
                            be defined
                          type: boolean
                      required:
                      - key
                      type: object
                      x-kubernetes-map-type: atomic
                    name:
                      description: Name of the value.
                      maxLength: 63
                      pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                      type: string
                    secretKeyRef:
                      description: SecretKeyRef reads the value from a Secret in the
                        same namespace.
                      properties:
                        key:
                          description: The key of the secret to select from.  Must
                            be a valid secret key.
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the Secret or its key must
                            be defined
                          type: boolean
                      required:
                      - key
                      type: object
                      x-kubernetes-map-type: atomic
                    value:
                      description: Value is a literal.
                      maxLength: 65536
                      type: string
                  required:
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of value, secretKeyRef and configMapKeyRef
                      is required
                    rule: '(has(self.value) ? 1 : 0) + (has(self.secretKeyRef) ? 1
                      : 0) + (has(self.configMapKeyRef) ? 1 : 0) == 1'
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - image
            type: object
          status:
            description: VyOSConfigStatus is the observed state of a VyOSConfig.
            properties:
              appliedHash:
                description: AppliedHash identifies the rendered configuration the
                  router runs.
                type: string
              conditions:
                description: |-
                  Conditions: Ready, ConfigApplied, Healthy, APIReachable, VRRPMaster,
                  Drained.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dataSecretName:
                description: |-
                  DataSecretName is the Secret holding the instance's user data under
                  the key "value".
                type: string
              initialization:
                description: Initialization of the bootstrap data.
                minProperties: 1
                properties:
                  dataSecretCreated:
                    description: DataSecretCreated is true once the bootstrap Secret
                      exists.
                    type: boolean
                type: object
              lastAppliedTime:
                description: LastAppliedTime is when the configuration was last changed.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation this status was
                  computed from.
                format: int64
                type: integer
              version:
                description: Version is the VyOS version the router reports.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
