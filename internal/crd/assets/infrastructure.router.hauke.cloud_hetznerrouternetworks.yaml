  names:
    categories:
    - router-api
    kind: HetznerRouterNetwork
    listKind: HetznerRouterNetworkList
    plural: hetznerrouternetworks
    shortNames:
    - hrn
    singular: hetznerrouternetwork
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.network.name
      name: Network
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HetznerRouterNetwork is what the routers of a group share at Hetzner Cloud:
          the API token, the private network, the firewall and the placement group.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HetznerRouterNetworkSpec is what the routers of a group share
              at Hetzner.
            properties:
              firewall:
                description: Firewall in front of the routers.
                properties:
                  managementPort:
                    default: 443
                    description: |-
                      ManagementPort is the port of the routers' management API. It is opened
                      to ManagementSources and to nothing else.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  managementSources:
                    description: ManagementSources the operator connects from.
                    items:
                      description: |-
                        ManagementSource is where the operator's connections to the routers come
                        from. Exactly one of CIDR and Hostname is set.
                      properties:
                        cidr:
                          description: CIDR is a fixed source range.
                          maxLength: 43
                          type: string
                        hostname:
                          description: |-
                            Hostname is resolved again and again, and the firewall follows the
                            answer. This is for an operator behind a connection whose address
                            changes, published through dynamic DNS.
                          maxLength: 253
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of cidr and hostname is required
                        rule: has(self.cidr) != has(self.hostname)
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                  rules:
                    description: |-
                      Rules for everything else the routers should receive: VPN endpoints,
                      forwarded services, ICMP.
                    items:
                      description: |-
                        FirewallRule opens the routers to inbound traffic. Anything not matched by
                        a rule is dropped before it reaches a router.
                      properties:
                        description:
                          description: Description shown in the Hetzner console.
                          maxLength: 255
                          type: string
                        port:
                          description: Port or port range ("443", "1024-2048"). Required
                            for tcp and udp.
                          pattern: ^(any|[0-9]{1,5}(-[0-9]{1,5})?)$
                          type: string
                        protocol:
                          description: Protocol to allow.
                          enum:
                          - tcp
                          - udp
                          - icmp
                          - esp
                          - gre
                          type: string
                        sourceCIDRs:
                          description: SourceCIDRs the traffic may come from. Defaults
                            to everywhere.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: set
                      required:
                      - protocol
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                required:
                - managementSources
                type: object
              network:
                description: Network the routers are attached to. VRRP between them
                  runs over it.
                properties:
                  name:
                    description: Name of the network.
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              placementGroup:
                description: PlacementGroup for the routers.
                properties:
                  enabled:
                    default: true
                    description: Enabled creates a spread placement group for the
                      routers.
                    type: boolean
                type: object
              sshKeys:
                description: |-
                  SSHKeys are the names of Hetzner SSH keys installed on the host, for
                  debugging. The operator itself never uses SSH.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              tokenSecretRef:
                description: |-
                  TokenSecretRef is the Hetzner Cloud API token, with read and write
                  access to the project.
                properties:
                  key:
                    default: token
                    description: Key in the Secret.
                    maxLength: 253
                    minLength: 1
                    type: string
                  name:
                    description: Name of the Secret.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - firewall
            - network
            - tokenSecretRef
            type: object
          status:
            description: HetznerRouterNetworkStatus is the observed state of a HetznerRouterNetwork.
            properties:
              conditions:
                description: 'Conditions: Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              firewallID:
                description: FirewallID of the firewall this object owns.
                format: int64
                type: integer
              managementCIDRs:
                description: |-
                  ManagementCIDRs currently allowed to reach the management port, after
                  resolving host names.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              networkID:
                description: NetworkID of the attached network.
                format: int64
                type: integer
              observedGeneration:
                description: ObservedGeneration is the generation this status was
                  computed from.
                format: int64
                type: integer
              placementGroupID:
                description: PlacementGroupID of the placement group this object owns.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
