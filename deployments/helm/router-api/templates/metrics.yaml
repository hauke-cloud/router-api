{{- range $manager, $config := .Values.managers }}
{{- if $config.enabled }}
{{- $ctx := dict "root" $ "manager" $manager }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "router-api.managerName" $ctx }}-metrics
  labels:
    {{- include "router-api.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ $.Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "router-api.selectorLabels" $ctx | nindent 4 }}
{{- if $.Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "router-api.managerName" $ctx }}
  labels:
    {{- include "router-api.labels" $ctx | nindent 4 }}
    {{- with $.Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "router-api.selectorLabels" $ctx | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ $.Values.metrics.serviceMonitor.interval }}
{{- end }}
{{- end }}
{{- end }}
