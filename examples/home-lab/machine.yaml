# Any change here replaces the routers, one at a time.
apiVersion: infrastructure.router.hauke.cloud/v1alpha1
kind: HetznerMachineTemplate
metadata:
  name: edge
spec:
  template:
    spec:
      networkRef:
        name: edge
      serverType: cx23
      location: fsn1
      image: ubuntu-24.04
      # The public address of the router in each slot. It stays when the
      # router is replaced, which is what the lab's router dials. These are
      # existing Hetzner Primary IPs, created in the same location and with
      # auto-delete off.
      primaryIPv4BySlot:
        - edge-0
        - edge-1
