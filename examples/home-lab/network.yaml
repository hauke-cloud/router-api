apiVersion: infrastructure.router.hauke.cloud/v1alpha1
kind: HetznerRouterNetwork
metadata:
  name: edge
spec:
  tokenSecretRef:
    name: hcloud
  # An existing Hetzner Cloud Network. It is neither created nor deleted here.
  network:
    name: lab
  firewall:
    # The operator runs in the lab, whose address changes every night. The
    # name is resolved once a minute and the firewall follows it.
    managementSources:
      - hostname: lab.example.net
    rules:
      - description: WireGuard, dialled by the lab
        protocol: udp
        port: "51820"
      - description: ping
        protocol: icmp
    # Everything else that is open is what the Gateways in the lab listen
    # on (exposure.yaml). A Hetzner firewall cannot tell the lab's addresses
    # apart, so a port is open towards all of them here; the routers
    # themselves are exact (config.yaml).
    exposureRef:
      name: edge
  # For debugging on the host. The operator itself never uses SSH.
  sshKeys:
    - admin
